[package]
name = "app"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "Bloco GPUI application (single window)"

[[bin]]
name = "bloco"
path = "src/main.rs"

[dependencies]
config = { path = "../config" }
term-session = { path = "../term-session" }
input-editor = { path = "../input-editor" }
# Zed's GPUI, pinned to the v1.26.2 release commit. See README.md in this crate.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c4273271092b0287f7d181f616bd5171e0a2f70c" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c4273271092b0287f7d181f616bd5171e0a2f70c", features = ["font-kit", "runtime_shaders"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
