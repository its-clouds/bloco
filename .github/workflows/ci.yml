name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a full commit SHA (the tag is in the
# comment). Dependabot keeps the pins up to date.
jobs:
  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no argument, rustup installs the toolchain in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install && rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install shells for integration tests
        run: brew install fish
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      # Warnings are reported but do not fail the build yet. Once the existing
      # lints are fixed, add `-- -D warnings` here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  linux-core:
    # The app needs GPUI's Linux system libraries, which are not set up yet.
    # The core crates have no UI and catch Linux-only problems (temp dirs,
    # /proc, shells) early.
    name: Test core crates (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install shells for integration tests
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Test
        run: cargo test --locked -p term-session -p input-editor -p config

  cargo-deny:
    name: Dependencies (advisories, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
